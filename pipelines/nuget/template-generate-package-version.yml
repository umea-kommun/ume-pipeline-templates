parameters:
  - name: templateRepoAlias
    type: string

  - name: packagePath
    type: string

  - name: packageName
    type: string

  - name: isStableRelease
    type: boolean

  - name: shouldPublish
    type: boolean
    default: true

  # Optional. When set, the script emits this version instead of computing one.
  # Use it to give several packages one shared version computed in a single job.
  - name: packageVersion
    type: string
    default: ''

steps:
  - checkout: self
    path: source
    persistCredentials: true
    fetchDepth: 0

  - checkout: ${{ parameters.templateRepoAlias }}
    path: templates

  - task: PowerShell@2
    displayName: Generate package version
    name: Task
    inputs:
      targetType: filePath
      filePath: $(Pipeline.Workspace)/templates/pipelines/nuget/scripts/generate-package-version.ps1
      workingDirectory: $(Pipeline.Workspace)/source
    env:
      PACKAGE_PATH: ${{ parameters.packagePath }}
      PACKAGE_NAME: ${{ parameters.packageName }}
      IS_STABLE_RELEASE: ${{ parameters.isStableRelease }}
      PACKAGE_VERSION: ${{ parameters.packageVersion }}

  - task: PowerShell@2
    displayName: Tag Current Build
    name: TagBuildTask
    condition: and(succeeded(), eq(${{ parameters.shouldPublish }}, true))
    inputs:
      targetType: filePath
      filePath: $(Pipeline.Workspace)/templates/pipelines/release/scripts/tag-build.ps1
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      BUILD_ID: $(Build.BuildId)
      TAG: $(Task.${{ parameters.packageName }}_PACKAGE_VERSION_TAG)
